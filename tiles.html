<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パラパラ タイル再生</title>
<style>
  :root {
    --bg: #16181d; --panel: #22252c; --fg: #e8e8ea; --muted: #9aa0aa;
    --accent: #ff8a3d; --line: #3a3e47;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Yu Gothic UI", sans-serif; min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 12px 0 0; font-size: 18px; }
  button, select {
    background: #2e323b; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1b1b1b; font-weight: 700; }
  label { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .info { color: var(--muted); font-size: 12px; margin-left: auto; }
  #fileInput { display: none; }

  #grid {
    display: grid; gap: var(--gap, 8px); padding: 16px 20px;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  }
  .tile { position: relative; background: #000; border-radius: 6px; overflow: hidden; height: var(--tile-h, 320px); }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 11px;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .15s;
  }
  .tile .del {
    position: absolute; right: 6px; top: 6px; padding: 2px 8px; font-size: 13px;
    background: rgba(0,0,0,.6); border: none; opacity: 0; transition: opacity .15s;
  }
  .tile:hover .name, .tile:hover .del { opacity: 1; }
  body.hide-names .tile .name { display: none; }

  #empty {
    margin: 60px auto; max-width: 520px; text-align: center; color: var(--muted);
    border: 2px dashed var(--line); border-radius: 12px; padding: 48px 24px;
  }
  body.dragover #empty, body.dragover #grid { outline: 3px dashed var(--accent); outline-offset: -8px; }
  body.fullview header, body.fullview #drivePanel { display: none !important; }
  #drivePanel { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; }
  #drivePanel .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin-bottom: 10px; }
  #drivePanel label.wide { flex: 1 1 320px; flex-direction: column; align-items: stretch; gap: 4px; font-size: 12px; color: var(--muted); }
  #drivePanel input[type=text], #drivePanel input[type=password] {
    background: #2e323b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 14px;
  }
  #drivePanel .status { font-size: 12px; color: var(--accent); }
  #drivePanel .note { margin: 0; font-size: 12px; color: var(--muted); }
  #driveToggle.on { border-color: var(--accent); }
  #drivePanel [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>パラパラ タイル再生</h1>
  <button class="primary" id="addBtn">WebM を追加</button>
  <button id="driveToggle" title="Google ドライブのフォルダから読み込む">☁ Google ドライブ</button>
  <input type="file" id="fileInput" accept="video/webm,video/*" multiple>
  <button id="playBtn">⏸ 一時停止 (Space)</button>
  <button id="syncBtn" title="全タイルを先頭から同時に再生">頭出し同期 (R)</button>
  <label>列数
    <select id="cols">
      <option>1</option><option>2</option><option>3</option><option selected>4</option>
      <option>5</option><option>6</option><option>8</option><option>10</option><option>12</option>
    </select>
  </label>
  <label>高さ <input type="range" id="tileH" min="80" max="900" value="320"></label>
  <label><input type="checkbox" id="showNames" checked> ファイル名</label>
  <button id="fullBtn" title="ヘッダーを隠して全画面表示 (F / Esc)">全画面 (F)</button>
  <button id="clearBtn">全削除</button>
  <span class="info" id="info">0 本</span>
</header>

<div id="drivePanel" hidden>
  <div class="row">
    <label>接続方法
      <select id="driveMode">
        <option value="gas">Apps Script（API キー不要）</option>
        <option value="key">API キー（公開フォルダ）</option>
        <option value="oauth">Google ログイン（非公開フォルダ）</option>
      </select>
    </label>
  </div>
  <div class="row" data-mode="gas">
    <label class="wide">Apps Script のウェブアプリ URL（…/exec）
      <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/xxxxxxxx/exec">
    </label>
  </div>
  <div class="row" data-mode="key oauth">
    <label class="wide">フォルダ URL または ID
      <input type="text" id="driveFolder" placeholder="https://drive.google.com/drive/folders/xxxxxxxx">
    </label>
  </div>
  <div class="row" data-mode="key">
    <label class="wide">API キー（フォルダを「リンクを知っている全員」に共有）
      <input type="password" id="driveKey" placeholder="AIza..." autocomplete="off">
    </label>
  </div>
  <div class="row" data-mode="oauth">
    <label class="wide">OAuth クライアント ID（http://localhost などで開いたときのみ）
      <input type="text" id="driveClient" placeholder="xxxx.apps.googleusercontent.com">
    </label>
  </div>
  <div class="row">
    <button class="primary" id="driveLoad">フォルダを読み込む</button>
    <button id="driveSignIn" data-mode="oauth" title="OAuth クライアント ID を使って Google にログイン">Google でログイン</button>
    <label><input type="checkbox" id="driveAuto"> 自動更新
      <select id="driveInterval">
        <option value="15">15 秒</option><option value="30" selected>30 秒</option>
        <option value="60">1 分</option><option value="300">5 分</option>
      </select>
    </label>
    <span class="status" id="driveStatus"></span>
  </div>
  <p class="note">
    フォルダ内の動画（WebM など）を名前順に並べます。再読み込みすると新しく追加されたファイルだけを足します。
    入力内容はこのブラウザにだけ保存されます。Apps Script の準備方法は README.md を参照してください。
  </p>
</div>

<div id="empty">
  ここに WebM ファイルをドラッグ＆ドロップ<br>
  または「WebM を追加」から複数選択してください
</div>
<div id="grid"></div>

<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const info = document.getElementById('info');
const playBtn = document.getElementById('playBtn');
let paused = false;

const videos = () => [...grid.querySelectorAll('video')];

function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('video/') && !/\.webm$/i.test(file.name)) continue;
    addTile(file.name, URL.createObjectURL(file));
  }
  update();
}

// onRemove: × で消したときに呼ばれる（ドライブのファイルを再表示しないため）
function addTile(fileName, url, onRemove) {
  {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const v = document.createElement('video');
    v.src = url;
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = !paused;
    // MediaRecorder 製の WebM は長さ情報が無く loop が効かない場合があるので保険
    v.addEventListener('ended', () => { v.currentTime = 0; if (!paused) v.play(); });

    const name = document.createElement('div');
    name.className = 'name'; name.textContent = fileName;

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = '削除';
    del.onclick = () => { URL.revokeObjectURL(v.src); tile.remove(); if (onRemove) onRemove(); update(); };

    tile.append(v, name, del);
    grid.appendChild(tile);
  }
}

function update() {
  const n = videos().length;
  info.textContent = `${n} 本`;
  empty.style.display = n ? 'none' : '';
}

// ---------- ファイル追加 ----------
const fileInput = document.getElementById('fileInput');
document.getElementById('addBtn').onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };

let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragover'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragover'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0;
  document.body.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});

// ---------- 再生操作 ----------
function togglePause() {
  paused = !paused;
  videos().forEach(v => paused ? v.pause() : v.play());
  playBtn.textContent = paused ? '▶ 再生 (Space)' : '⏸ 一時停止 (Space)';
}
function syncAll() {
  videos().forEach(v => { v.currentTime = 0; if (!paused) v.play(); });
}
playBtn.onclick = togglePause;
document.getElementById('syncBtn').onclick = syncAll;
document.getElementById('clearBtn').onclick = () => {
  if (!videos().length || !confirm('すべて削除しますか？')) return;
  videos().forEach(v => URL.revokeObjectURL(v.src));
  grid.innerHTML = ''; driveLoaded.clear(); update();
};

// ---------- 表示設定 ----------
const colsSel = document.getElementById('cols');
const tileH = document.getElementById('tileH');
colsSel.onchange = () => grid.style.setProperty('--cols', colsSel.value);
tileH.oninput = () => grid.style.setProperty('--tile-h', tileH.value + 'px');
document.getElementById('showNames').onchange = e => document.body.classList.toggle('hide-names', !e.target.checked);

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fullview', !!document.fullscreenElement);
});
document.getElementById('fullBtn').onclick = toggleFull;

// ---------- キーボード ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyR') syncAll();
  else if (e.code === 'KeyF') toggleFull();
});

// ---------- Google ドライブ ----------
const $ = id => document.getElementById(id);
const driveStatus = $('driveStatus');
const driveLoaded = new Set();     // 読み込み済み（または × で消した）ファイル ID
let accessToken = null, tokenClient = null, autoTimer = null, driveBusy = false;

$('driveToggle').onclick = () => {
  const panel = $('drivePanel');
  panel.hidden = !panel.hidden;
  $('driveToggle').classList.toggle('on', !panel.hidden);
};

// 入力内容をこのブラウザに保存
const SETTINGS = ['driveMode', 'gasUrl', 'driveFolder', 'driveKey', 'driveClient', 'driveInterval'];
try {
  const saved = JSON.parse(localStorage.getItem('tiles-drive') || '{}');
  SETTINGS.forEach(k => { if (saved[k]) $(k).value = saved[k]; });
} catch (e) {}
function saveSettings() {
  try { localStorage.setItem('tiles-drive', JSON.stringify(Object.fromEntries(SETTINGS.map(k => [k, $(k).value])))); } catch (e) {}
}
SETTINGS.forEach(k => $(k).addEventListener('change', saveSettings));

// 接続方法に応じて入力欄を出し分ける
const mode = () => $('driveMode').value;
function showModeFields() {
  document.querySelectorAll('#drivePanel [data-mode]').forEach(el => {
    el.hidden = !el.dataset.mode.split(' ').includes(mode());
  });
}
$('driveMode').addEventListener('change', showModeFields);
showModeFields();

// Apps Script 中継（gas/Code.gs）への GET
async function gasGet(params = {}) {
  const base = $('gasUrl').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(base)) {
    throw new Error('Apps Script のウェブアプリ URL（https://script.google.com/…/exec）を入力してください');
  }
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(base + (qs ? (base.includes('?') ? '&' : '?') + qs : ''));
  if (!res.ok) throw new Error(`${res.status}`);
  let data;
  try { data = JSON.parse(await res.text()); }
  catch (e) { throw new Error('Apps Script の応答を読めません（デプロイの「アクセスできるユーザー」が「全員」か確認してください）'); }
  if (data.error) throw new Error(data.error);
  return data;
}
function base64ToBlob(b64, type) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: type || 'video/webm' });
}

// 接続方法ごとの一覧取得 / ダウンロード
async function listDriveFiles() {
  if (mode() === 'gas') return (await gasGet()).files;
  const id = folderId();
  if (!id) throw new Error('フォルダ URL または ID を入力してください');
  if (mode() === 'oauth' && !accessToken) throw new Error('先に「Google でログイン」してください');
  return listFolder(id);
}
async function downloadDriveFile(f) {
  if (mode() === 'gas') {
    const d = await gasGet({ id: f.id });
    return base64ToBlob(d.data, d.mimeType);
  }
  return (await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&supportsAllDrives=true`)).blob();
}

function folderId() {
  const v = $('driveFolder').value.trim();
  const m = v.match(/folders\/([\w-]+)/) || v.match(/[?&]id=([\w-]+)/);
  return m ? m[1] : v;
}

// ログイン済みならトークン、そうでなければ API キーで認証
async function driveFetch(url) {
  const headers = {};
  if (mode() === 'oauth' && accessToken) headers.Authorization = `Bearer ${accessToken}`;
  else if ($('driveKey').value.trim()) url += `${url.includes('?') ? '&' : '?'}key=${encodeURIComponent($('driveKey').value.trim())}`;
  else throw new Error('API キーを入力するか、Google でログインしてください');
  const res = await fetch(url, { headers });
  if (!res.ok) {
    let msg = `${res.status}`;
    try { msg += ' ' + (await res.json()).error.message; } catch (e) {}
    if (res.status === 401) accessToken = null;
    throw new Error(msg);
  }
  return res;
}

async function listFolder(id) {
  const q = `'${id}' in parents and trashed = false and (mimeType contains 'video/' or name contains '.webm')`;
  const files = [];
  let pageToken = '';
  do {
    const url = 'https://www.googleapis.com/drive/v3/files?' + new URLSearchParams({
      q, orderBy: 'name', pageSize: '1000',
      fields: 'nextPageToken, files(id, name, mimeType)',
      supportsAllDrives: 'true', includeItemsFromAllDrives: 'true',
      ...(pageToken ? { pageToken } : {}),
    });
    const data = await (await driveFetch(url)).json();
    files.push(...data.files);
    pageToken = data.nextPageToken;
  } while (pageToken);
  return files;
}

async function loadDrive() {
  if (driveBusy) return;
  saveSettings();
  driveBusy = true;
  try {
    driveStatus.textContent = 'フォルダを確認中…';
    const files = (await listDriveFiles()).filter(f => !driveLoaded.has(f.id));
    let n = 0;
    for (const f of files) {
      driveStatus.textContent = `ダウンロード中… ${++n} / ${files.length}　${f.name}`;
      const blob = await downloadDriveFile(f);
      driveLoaded.add(f.id);
      addTile(f.name, URL.createObjectURL(blob), () => driveLoaded.add(f.id));
      update();
    }
    driveStatus.textContent = files.length
      ? `${files.length} 本追加しました（${new Date().toLocaleTimeString()}）`
      : `新しいファイルはありません（${new Date().toLocaleTimeString()}）`;
    if (files.length && !paused) syncAll();
  } catch (err) {
    driveStatus.textContent = '読み込みに失敗しました: ' + err.message;
  } finally {
    driveBusy = false;
  }
}
$('driveLoad').onclick = loadDrive;

// 非公開フォルダ用：Google Identity Services でログイン（http(s) で開いたときのみ）
function loadGis() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.onload = res; sc.onerror = () => rej(new Error('Google ログイン用スクリプトを読み込めません'));
    document.head.appendChild(sc);
  });
}
$('driveSignIn').onclick = async () => {
  const clientId = $('driveClient').value.trim();
  if (!clientId) { driveStatus.textContent = 'OAuth クライアント ID を入力してください'; return; }
  if (location.protocol === 'file:') {
    driveStatus.textContent = 'ログインは http://localhost などで開いたときのみ使えます（file:// 不可）';
    return;
  }
  saveSettings();
  try {
    await loadGis();
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: r => {
        if (r.error) { driveStatus.textContent = 'ログインに失敗しました: ' + r.error; return; }
        accessToken = r.access_token;
        $('driveSignIn').textContent = 'ログイン済み';
        driveStatus.textContent = 'ログインしました';
        loadDrive();
      },
    });
    tokenClient.requestAccessToken();
  } catch (err) {
    driveStatus.textContent = err.message;
  }
};

// 自動更新（新しく追加されたファイルを定期的に取り込む）
function setAuto() {
  clearInterval(autoTimer); autoTimer = null;
  if ($('driveAuto').checked) autoTimer = setInterval(loadDrive, Number($('driveInterval').value) * 1000);
}
$('driveAuto').onchange = () => { setAuto(); if ($('driveAuto').checked) loadDrive(); };
$('driveInterval').addEventListener('change', setAuto);

update();
</script>
</body>
</html>
