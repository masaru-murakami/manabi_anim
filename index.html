<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam パラパラアニメ</title>
<style>
  :root {
    --bg: #16181d; --panel: #22252c; --fg: #e8e8ea; --muted: #9aa0aa;
    --accent: #ff8a3d; --line: #3a3e47;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Yu Gothic UI", sans-serif; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border-radius: 10px; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .stage { position: relative; line-height: 0; background: #000; border-radius: 6px; overflow: hidden; }
  .stage video { width: 100%; height: auto; display: block; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button, select, input[type=number] {
    background: #2e323b; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1b1b1b; font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number] { width: 70px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .player-view { background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; }
  #playCanvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
  .info { font-size: 12px; color: var(--muted); margin-left: auto; }
  .frames { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 260px; overflow-y: auto; }
  .thumb { position: relative; border: 2px solid transparent; border-radius: 4px; line-height: 0; }
  .thumb.current { border-color: var(--accent); }
  .thumb canvas { height: 64px; width: auto; border-radius: 2px; }
  .thumb .no { position: absolute; left: 3px; top: 3px; font-size: 10px; line-height: 1; background: rgba(0,0,0,.6); padding: 2px 4px; border-radius: 3px; }
  .thumb .del { position: absolute; right: 2px; top: 2px; padding: 0 5px; font-size: 12px; line-height: 16px; background: rgba(0,0,0,.6); border: none; display: none; }
  .thumb:hover .del { display: block; }
  .thumb { cursor: grab; }
  .thumb.dragging { opacity: .35; }
  .thumb.drop-before { box-shadow: -5px 0 0 -1px var(--accent); }
  .thumb.drop-after { box-shadow: 5px 0 0 -1px var(--accent); }
  .flash { animation: flash .15s; }
  @keyframes flash { from { filter: brightness(2.5); } to { filter: none; } }
</style>
</head>
<body>
<header><h1>Webcam パラパラアニメ</h1></header>
<main>
  <section>
    <h2>カメラ</h2>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <select id="cameraSelect" title="カメラ選択"></select>
      <button id="captureBtn" class="primary">撮影 (Space)</button>
      <button id="burstBtn" title="FPS と同じ間隔で連続撮影">連写 開始</button>
      <label><input type="checkbox" id="onion" checked> オニオンスキン</label>
      <button id="resetCrop">クロップ解除</button>
    </div>
    <p class="hint">映像の上をドラッグしてクロップ範囲を指定します。撮影すると範囲内だけがフレームとして保存されます。</p>
  </section>

  <section>
    <h2>パラパラ再生</h2>
    <div class="player-view"><canvas id="playCanvas" width="320" height="320"></canvas></div>
    <div class="controls">
      <button id="playBtn" class="primary">▶ 再生 (Enter)</button>
      <label>FPS <input type="number" id="fps" value="8" min="1" max="60"></label>
      <button id="undoBtn">最後を削除</button>
      <button id="clearBtn">全削除</button>
      <button id="saveBtn">WebM 保存</button>
      <span class="info" id="info">0 フレーム</span>
    </div>
    <div class="frames" id="frames"></div>
  </section>
</main>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const playCanvas = document.getElementById('playCanvas');
const pctx = playCanvas.getContext('2d');
const framesEl = document.getElementById('frames');
const infoEl = document.getElementById('info');
const fpsInput = document.getElementById('fps');
const playBtn = document.getElementById('playBtn');
const burstBtn = document.getElementById('burstBtn');
const cameraSelect = document.getElementById('cameraSelect');

// クロップ範囲（映像に対する 0〜1 の正規化座標）
let crop = { x: 0.25, y: 0.15, w: 0.5, h: 0.7 };
let dragStart = null;
const frames = [];      // 撮影したフレーム（canvas）
let playing = false, playTimer = null, playIndex = 0;
let burstTimer = null;
let stream = null;

const getFps = () => Math.min(60, Math.max(1, Number(fpsInput.value) || 8));

// ---------- カメラ ----------
async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const constraints = {
    video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    : { width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  };
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await listCameras(stream.getVideoTracks()[0].getSettings().deviceId);
  } catch (e) {
    alert('カメラを起動できませんでした: ' + e.message);
  }
}

async function listCameras(currentId) {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  cameraSelect.innerHTML = '';
  devices.forEach((d, i) => {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    opt.textContent = d.label || `カメラ ${i + 1}`;
    if (d.deviceId === currentId) opt.selected = true;
    cameraSelect.appendChild(opt);
  });
}
cameraSelect.onchange = () => startCamera(cameraSelect.value);

// ---------- クロップ範囲の指定 ----------
function toNorm(e) {
  const r = overlay.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  };
}
overlay.addEventListener('pointerdown', e => {
  overlay.setPointerCapture(e.pointerId);
  dragStart = toNorm(e);
});
overlay.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const p = toNorm(e);
  crop = {
    x: Math.min(dragStart.x, p.x), y: Math.min(dragStart.y, p.y),
    w: Math.abs(p.x - dragStart.x), h: Math.abs(p.y - dragStart.y),
  };
});
overlay.addEventListener('pointerup', () => {
  dragStart = null;
  // 小さすぎる範囲は無効にして全体を使う
  if (crop.w < 0.02 || crop.h < 0.02) crop = { x: 0, y: 0, w: 1, h: 1 };
});
document.getElementById('resetCrop').onclick = () => { crop = { x: 0, y: 0, w: 1, h: 1 }; };

// オーバーレイ描画（範囲外を暗く + オニオンスキン）
function drawOverlay() {
  const w = overlay.clientWidth, h = overlay.clientHeight;
  if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
  octx.clearRect(0, 0, w, h);
  const cx = crop.x * w, cy = crop.y * h, cw = crop.w * w, ch = crop.h * h;

  if (document.getElementById('onion').checked && frames.length) {
    octx.globalAlpha = 0.35;
    octx.drawImage(frames[frames.length - 1], cx, cy, cw, ch);
    octx.globalAlpha = 1;
  }
  octx.fillStyle = 'rgba(0,0,0,0.55)';
  octx.beginPath();
  octx.rect(0, 0, w, h);
  octx.rect(cx, cy, cw, ch);
  octx.fill('evenodd');
  octx.strokeStyle = '#ff8a3d';
  octx.lineWidth = 2;
  octx.strokeRect(cx, cy, cw, ch);
  requestAnimationFrame(drawOverlay);
}
requestAnimationFrame(drawOverlay);

// ---------- 撮影 ----------
function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const sx = Math.round(crop.x * vw), sy = Math.round(crop.y * vh);
  const sw = Math.max(1, Math.round(crop.w * vw)), sh = Math.max(1, Math.round(crop.h * vh));
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
  frames.push(c);
  if (!playing) showFrame(frames.length - 1);
  renderThumbs();
  const stage = document.getElementById('stage');
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');
}
document.getElementById('captureBtn').onclick = capture;

function toggleBurst() {
  if (burstTimer) {
    clearInterval(burstTimer); burstTimer = null;
    burstBtn.textContent = '連写 開始';
  } else {
    burstTimer = setInterval(capture, 1000 / getFps());
    burstBtn.textContent = '■ 連写 停止';
  }
}
burstBtn.onclick = toggleBurst;

// ---------- サムネイル ----------
function renderThumbs() {
  framesEl.innerHTML = '';
  frames.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const t = document.createElement('canvas');
    t.width = f.width; t.height = f.height;
    t.getContext('2d').drawImage(f, 0, 0);
    t.onclick = () => { stop(); showFrame(i); };
    const no = document.createElement('span');
    no.className = 'no'; no.textContent = i + 1;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = '削除';
    del.onclick = ev => { ev.stopPropagation(); frames.splice(i, 1); afterChange(); };
    d.append(t, no, del);

    // ドラッグ＆ドロップで並べ替え
    d.draggable = true;
    d.addEventListener('dragstart', ev => {
      dragFrom = i;
      ev.dataTransfer.effectAllowed = 'move';
      d.classList.add('dragging');
    });
    d.addEventListener('dragend', () => {
      dragFrom = null;
      d.classList.remove('dragging');
      clearDropMarks();
    });
    d.addEventListener('dragover', ev => {
      if (dragFrom === null) return;
      ev.preventDefault();
      // サムネイルの左半分なら前、右半分なら後ろに挿入
      const r = d.getBoundingClientRect();
      const after = ev.clientX > r.left + r.width / 2;
      clearDropMarks();
      d.classList.add(after ? 'drop-after' : 'drop-before');
    });
    d.addEventListener('drop', ev => {
      ev.preventDefault();
      if (dragFrom === null) return;
      const r = d.getBoundingClientRect();
      let to = ev.clientX > r.left + r.width / 2 ? i + 1 : i;
      if (dragFrom < to) to--;
      moveFrame(dragFrom, to);
    });
    framesEl.appendChild(d);
  });
  framesEl.scrollTop = framesEl.scrollHeight;
  infoEl.textContent = `${frames.length} フレーム`;
  highlight();
}

let dragFrom = null;

function clearDropMarks() {
  framesEl.querySelectorAll('.drop-before, .drop-after')
    .forEach(el => el.classList.remove('drop-before', 'drop-after'));
}

function moveFrame(from, to) {
  if (from === to) { clearDropMarks(); return; }
  const [f] = frames.splice(from, 1);
  frames.splice(to, 0, f);
  if (!playing) showFrame(to);
  renderThumbs();
}

function highlight() {
  [...framesEl.children].forEach((el, i) => el.classList.toggle('current', i === playIndex));
}

function afterChange() {
  if (!frames.length) { stop(); pctx.clearRect(0, 0, playCanvas.width, playCanvas.height); playIndex = 0; }
  else { playIndex = Math.min(playIndex, frames.length - 1); if (!playing) showFrame(playIndex); }
  renderThumbs();
}

// ---------- 再生 ----------
function showFrame(i) {
  const f = frames[i];
  if (!f) return;
  playIndex = i;
  // 再生キャンバスは先頭フレームのサイズに合わせ、各フレームはアスペクト比を保って収める
  const base = frames[0];
  if (playCanvas.width !== base.width || playCanvas.height !== base.height) {
    playCanvas.width = base.width; playCanvas.height = base.height;
  }
  pctx.fillStyle = '#000';
  pctx.fillRect(0, 0, playCanvas.width, playCanvas.height);
  const s = Math.min(playCanvas.width / f.width, playCanvas.height / f.height);
  const w = f.width * s, h = f.height * s;
  pctx.drawImage(f, (playCanvas.width - w) / 2, (playCanvas.height - h) / 2, w, h);
  highlight();
}

function tick() {
  if (!playing || !frames.length) return;
  showFrame(playIndex);
  playIndex = (playIndex + 1) % frames.length;
  playTimer = setTimeout(tick, 1000 / getFps());
}

function play() {
  if (!frames.length) return;
  playing = true; playIndex = 0;
  playBtn.textContent = '■ 停止 (Enter)';
  tick();
}
function stop() {
  playing = false; clearTimeout(playTimer);
  playBtn.textContent = '▶ 再生 (Enter)';
}
playBtn.onclick = () => playing ? stop() : play();

document.getElementById('undoBtn').onclick = () => { frames.pop(); afterChange(); };
document.getElementById('clearBtn').onclick = () => {
  if (frames.length && confirm('すべてのフレームを削除しますか？')) { frames.length = 0; afterChange(); }
};

// ---------- WebM 保存 ----------
document.getElementById('saveBtn').onclick = async () => {
  if (!frames.length) return;
  stop();
  const fps = getFps();
  const rec = new MediaRecorder(playCanvas.captureStream(fps), { mimeType: 'video/webm' });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  for (let i = 0; i < frames.length; i++) {
    showFrame(i);
    await new Promise(r => setTimeout(r, 1000 / fps));
  }
  rec.stop();
  await done;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
  a.download = `flipbook_${fps}fps.webm`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---------- キーボード ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); capture(); }
  else if (e.code === 'Enter') { e.preventDefault(); playing ? stop() : play(); }
  else if (e.code === 'Backspace') { e.preventDefault(); frames.pop(); afterChange(); }
});

startCamera();
</script>
</body>
</html>
